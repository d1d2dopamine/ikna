name: catalogue v2 knowledge experiment

# Parts 8 + 10 preview. Measures every direct WikiMatrix pair, applies the
# inspectable pair policy, then runs deterministic target/context selection.
on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Languages, comma separated"
        default: "en,ru,pl,es,fr,de,it,pt,zh,ja,ko"
      acquisition_rows:
        description: "Top WikiMatrix rows acquired per physical pair"
        default: "50000"
      max_deck:
        description: "Part 10 safety budget per level"
        default: "8000"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parts 8 and 10 contracts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libicu-dev
          python3 tools/catalog/test_ingestion.py
          python3 tools/catalog/test_knowledge_rebuild.py
          python3 tools/catalog/test_selection_policy.py

  knowledge-preview:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare workspace
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libicu-dev
          mkdir -p candidates reports

      - name: Plan direct pairs
        run: |
          python3 tools/catalog/wikimatrix_plan.py --langs "${{ inputs.langs }}" --all-direct > reports/wikimatrix-plan.tsv
          printf 'first\tsecond\tstatus\trows\turl\n' > reports/wikimatrix-inventory.tsv

      - name: Acquire bounded high-score prefixes
        shell: bash
        run: |
          set -euo pipefail
          max_rows="${{ inputs.acquisition_rows }}"
          case "$max_rows" in (*[!0-9]*|'') echo "acquisition_rows must be a non-negative integer" >&2; exit 2;; esac
          while IFS=$'\t' read -r first second url; do
            [ -n "$url" ] || continue
            code=$(curl --location --silent --show-error --http1.1 --connect-timeout 30 --retry 3 --retry-all-errors --head --output /dev/null --write-out '%{http_code}' "$url" || true)
            if [ "$code" = 404 ]; then
              printf '%s\t%s\tmissing\t0\t%s\n' "$first" "$second" "$url" >> reports/wikimatrix-inventory.tsv
              continue
            fi
            case "$code" in 200|206) ;; *) echo "availability probe HTTP $code for $url" >&2; exit 1;; esac
            out="candidates/wikimatrix-${first}-${second}.jsonl.gz"
            cmd=(python3 tools/catalog/ingest_sources.py wikimatrix-pair --tsv - --first "$first" --second "$second" --source-version v1 --out "$out")
            [ "$max_rows" -eq 0 ] || cmd+=(--max-rows "$max_rows")
            attempt=1
            while :; do
              rm -f "$out"
              set +e
              curl --fail --location --silent --show-error --http1.1 --connect-timeout 30 --retry 3 --retry-all-errors "$url" | gzip -dc | "${cmd[@]}"
              status=("${PIPESTATUS[@]}")
              set -e
              curl_status=${status[0]}
              gzip_status=${status[1]}
              python_status=${status[2]}
              if [ "$python_status" -eq 0 ] \
                && { [ "$curl_status" -eq 0 ] || [ "$curl_status" -eq 23 ]; } \
                && { [ "$gzip_status" -eq 0 ] || [ "$gzip_status" -eq 141 ]; }; then
                break
              fi
              if [ "$attempt" -ge 5 ]; then
                echo "WikiMatrix stream failed for $first-$second (curl=$curl_status gzip=$gzip_status python=$python_status)" >&2
                exit 1
              fi
              echo "WikiMatrix stream failed for $first-$second on attempt $attempt/5; retrying..." >&2
              attempt=$((attempt + 1))
              sleep $((attempt * 3))
            done
            rows=$(gzip -cd "$out" | wc -l | tr -d ' ')
            [ $((rows % 2)) -eq 0 ] || { echo "non-symmetric WikiMatrix output" >&2; exit 1; }
            printf '%s\t%s\tavailable\t%s\t%s\n' "$first" "$second" "$((rows/2))" "$url" >> reports/wikimatrix-inventory.tsv
            sleep 1
          done < reports/wikimatrix-plan.tsv
          cat reports/wikimatrix-inventory.tsv

      - name: Apply pair-specific Knowledge policy
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(candidates/*.jsonl.gz)
          [ ${#files[@]} -gt 0 ] || { echo "No direct WikiMatrix pairs were acquired" >&2; exit 1; }
          python3 tools/catalog/knowledge_rebuild.py \
            --candidates "${files[@]}" \
            --pool reports/knowledge-preview.jsonl.gz \
            --json reports/KNOWLEDGE-PREVIEW.json \
            --markdown reports/KNOWLEDGE-PREVIEW.md \
            --samples reports/KNOWLEDGE-SAMPLES.md
          cat reports/KNOWLEDGE-PREVIEW.md >> "$GITHUB_STEP_SUMMARY"

      - name: Part 10 deterministic selection over Knowledge preview
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/catalog/selection_experiment.py \
            --candidates reports/knowledge-preview.jsonl.gz \
            --json reports/KNOWLEDGE-SELECTION.json \
            --markdown reports/KNOWLEDGE-SELECTION.md \
            --preview reports/knowledge-selection-preview.jsonl.gz \
            --staging reports/knowledge-selection.sqlite3 \
            --learn "${{ inputs.langs }}" --meanings "${{ inputs.langs }}" \
            --max-deck "${{ inputs.max_deck }}"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat reports/KNOWLEDGE-SELECTION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Parts 8 and 10 evidence
        uses: actions/upload-artifact@v6
        with:
          name: catalogue-v2-knowledge-experiment
          path: |
            reports/KNOWLEDGE-PREVIEW.json
            reports/KNOWLEDGE-PREVIEW.md
            reports/KNOWLEDGE-SAMPLES.md
            reports/KNOWLEDGE-SELECTION.json
            reports/KNOWLEDGE-SELECTION.md
            reports/wikimatrix-plan.tsv
            reports/wikimatrix-inventory.tsv
          if-no-files-found: error
          retention-days: 14
