name: catalogue v2 world attribution experiment

# Part 9 provenance experiment. XCES document/sentence ids are resolved against
# the native OPUS XML archives. Moses line numbers are deliberately not used.
# Article URLs/contributors still require an explicit trustworthy manifest;
# unresolved documents are evidence, never guessed attribution.
on:
  workflow_dispatch:
    inputs:
      learn:
        description: "Learning language for one diagnostic Global Voices pair"
        default: "en"
      meaning:
        description: "Meaning language"
        default: "es"
      article_manifest_url:
        description: "Optional JSONL document -> Global Voices URL/contributors manifest"
        default: ""

permissions:
  contents: read

jobs:
  world-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contracts
        run: |
          python3 tools/catalog/test_globalvoices_attribution.py
          python3 tools/catalog/test_ingestion.py

      - name: Resolve OPUS native download URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p opus reports
          python3 - "${{ inputs.learn }}" "${{ inputs.meaning }}" <<'PY' > reports/opus-urls.tsv
          import json,sys,urllib.parse,urllib.request

          learn,meaning=(x.strip().lower() for x in sys.argv[1:3])
          opus_code={"ja":"jp","zh":"zhs"}
          source=opus_code.get(learn,learn)
          target=opus_code.get(meaning,meaning)
          if source == target:
              raise SystemExit("World diagnostic languages must differ")
          base='https://opus.nlpl.eu/opusapi/'
          query=urllib.parse.urlencode({
              'corpus':'GlobalVoices','source':source,'target':target,
              'preprocessing':'xml','version':'v2018q4'
          })
          with urllib.request.urlopen(base+'?'+query, timeout=60) as r:
              data=json.load(r)
          rows=data.get('corpora') or []
          if not rows:
              raise SystemExit(f'OPUS has no GlobalVoices XML alignment for {source}-{target}')
          xml_url=rows[0]['url']
          marker='/xml/'
          if marker not in xml_url:
              raise SystemExit(f'unexpected OPUS XML URL: {xml_url}')
          root=xml_url.split(marker,1)[0]
          print('iknaLearn\t'+learn)
          print('iknaMeaning\t'+meaning)
          print('opusLearn\t'+source)
          print('opusMeaning\t'+target)
          print('alignment\t'+xml_url)
          print('contextArchive\t'+root+'/raw/'+source+'.zip')
          print('meaningArchive\t'+root+'/raw/'+target+'.zip')
          PY
          cat reports/opus-urls.tsv

      - name: Download XCES and native XML archives
        shell: bash
        run: |
          set -euo pipefail
          alignment_url=$(awk -F'\t' '$1=="alignment"{print $2}' reports/opus-urls.tsv)
          context_url=$(awk -F'\t' '$1=="contextArchive"{print $2}' reports/opus-urls.tsv)
          meaning_url=$(awk -F'\t' '$1=="meaningArchive"{print $2}' reports/opus-urls.tsv)
          bash tools/ci/fetch-url.sh "$alignment_url" opus/alignment.xml.gz
          bash tools/ci/fetch-url.sh "$context_url" opus/context-raw.zip
          bash tools/ci/fetch-url.sh "$meaning_url" opus/meaning-raw.zip
          gzip -t opus/alignment.xml.gz
          unzip -tq opus/context-raw.zip >/dev/null
          unzip -tq opus/meaning-raw.zip >/dev/null
          sha256sum opus/alignment.xml.gz opus/context-raw.zip opus/meaning-raw.zip > reports/opus-native-sha256.txt

      - name: Resolve XCES sentence ids against native XML
        shell: bash
        run: |
          set -euo pipefail
          opus_learn=$(awk -F'\t' '$1=="opusLearn"{print $2}' reports/opus-urls.tsv)
          opus_meaning=$(awk -F'\t' '$1=="opusMeaning"{print $2}' reports/opus-urls.tsv)
          python3 tools/catalog/globalvoices_native.py \
            --xces opus/alignment.xml.gz \
            --context-archive opus/context-raw.zip \
            --meaning-archive opus/meaning-raw.zip \
            --context-lang "$opus_learn" --meaning-lang "$opus_meaning" \
            --learn-out reports/world-native.learn.txt.gz \
            --meaning-out reports/world-native.meaning.txt.gz \
            --alignment-map reports/globalvoices-alignment-map.jsonl.gz \
            --json reports/WORLD-NATIVE-XCES.json \
            --markdown reports/WORLD-NATIVE-XCES.md \
            --samples reports/WORLD-NATIVE-SAMPLES.md
          cat reports/WORLD-NATIVE-XCES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve article attribution without guessing
        shell: bash
        run: |
          set -euo pipefail
          : > reports/article-manifest.jsonl
          if [ -n "${{ inputs.article_manifest_url }}" ]; then
            bash tools/ci/fetch-url.sh "${{ inputs.article_manifest_url }}" reports/article-manifest.jsonl
          fi
          python3 tools/catalog/globalvoices_attribution.py \
            --alignment-map reports/globalvoices-alignment-map.jsonl.gz \
            --article-manifest reports/article-manifest.jsonl \
            --out reports/globalvoices-attribution-original-lines.jsonl.gz \
            --learn-file reports/world-native.learn.txt.gz \
            --meaning-file reports/world-native.meaning.txt.gz \
            --filtered-learn reports/world.learn.txt.gz \
            --filtered-meaning reports/world.meaning.txt.gz \
            --filtered-attribution reports/world-attribution.jsonl.gz \
            --json reports/WORLD-ATTRIBUTION.json \
            --markdown reports/WORLD-ATTRIBUTION.md
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat reports/WORLD-ATTRIBUTION.md >> "$GITHUB_STEP_SUMMARY"

      - name: Normalize fully attributed World rows
        shell: bash
        run: |
          set -euo pipefail
          rows=$(gzip -cd reports/world.learn.txt.gz | wc -l | tr -d ' ')
          if [ "$rows" -eq 0 ]; then
            echo "No fully attributed World rows yet; this is a Part 9 evidence result." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 tools/catalog/ingest_sources.py globalvoices \
            --learn-file reports/world.learn.txt.gz \
            --meaning-file reports/world.meaning.txt.gz \
            --attribution-file reports/world-attribution.jsonl.gz \
            --learn "${{ inputs.learn }}" --meaning "${{ inputs.meaning }}" \
            --source-version v2018q4 \
            --out reports/world-candidates.jsonl.gz

      - name: Keep Part 9 evidence
        uses: actions/upload-artifact@v6
        with:
          name: catalogue-v2-world-attribution-experiment
          path: |
            reports/opus-urls.tsv
            reports/opus-native-sha256.txt
            reports/WORLD-NATIVE-XCES.json
            reports/WORLD-NATIVE-XCES.md
            reports/WORLD-NATIVE-SAMPLES.md
            reports/WORLD-ATTRIBUTION.json
            reports/WORLD-ATTRIBUTION.md
            reports/article-manifest.jsonl
            reports/globalvoices-attribution-original-lines.jsonl.gz
            reports/world-candidates.jsonl.gz
          if-no-files-found: warn
          retention-days: 14
