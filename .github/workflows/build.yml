name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # A build that cannot finish should say so instead of sitting there. Without
    # this, a stuck download or an unavailable action holds the runner for six
    # hours - the default - and the only signal is a spinner.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No wrapper jar is committed, so the Gradle version is pinned here.
      # 8.10.2 is the version this project's AGP 8.6.1 / Kotlin 2.0.20 pair is
      # tested against; letting the action pick "latest" silently changes the
      # toolchain under the build.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # The APK is built and uploaded before the tests run, on purpose. The tests
      # cover the scheduler and the governor, which are worth failing the run
      # over — but a failing test used to mean no artifact at all, so a run that
      # was meant to produce something installable produced a red cross instead.
      # Now the run still goes red, and the APK is still there.
      # lite, explicitly. With two flavours there is no such task as
      # assembleDebug that means one thing, and the voice build needs a model
      # this runner has no business downloading on every push.
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleLiteDebug

      # Prints the signing certificate so a failed "install over the old app"
      # can be diagnosed from the log instead of the phone.
      - name: Signer
        run: |
          apk=$(find app/build/outputs/apk/lite/debug -name '*.apk' | head -1)
          echo "APK: $apk"
          keytool -printcert -jarfile "$apk" | grep -E 'Owner|SHA256' || true

      - name: APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ikna-apk
          path: app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: warn

      # Room writes the schema of every version to app/schemas during the build,
      # and those files are what make a migration testable: without the old
      # schema there is nothing to migrate from, and an upgrade that drops user
      # data looks exactly like one that does not. They are meant to be
      # committed; uploading them here means a build always makes the current
      # one available, even if someone forgets.
      - name: Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ikna-room-schemas
          path: app/schemas
          if-no-files-found: warn

      # The artifact above is a convenience; this is the check. A build
      # regenerates the current schema, so no test can ever notice that the
      # folder was never committed - by the time tests run, the files are there.
      # Git can tell the difference. Anything untracked or changed under
      # app/schemas means this build produced a schema the repository does not
      # have, and the fix is always the same: commit it.
      - name: Schemas are committed
        run: |
          changes=$(git status --porcelain app/schemas)
          if [ -n "$changes" ]; then
            echo "app/schemas is untracked or has changed:"
            echo "$changes"
            echo "Download the ikna-room-schemas artifact, or run the build"
            echo "locally, and commit app/schemas. Migrations cannot be checked"
            echo "against a schema history that is not in the repository."
            exit 1
          fi

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testLiteReleaseUnitTest

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ikna-test-report
          path: app/build/reports/tests/testLiteReleaseUnitTest
          if-no-files-found: ignore
