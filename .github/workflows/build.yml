name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The Android application. Every step here is the one that was here
  # before the desktop build existed.
  android:
    runs-on: ubuntu-latest

    # A build that cannot finish should say so instead of sitting there.
    # Without this, a stuck download or an unavailable action holds the
    # runner for six hours - the default - and the only signal is a spinner.
    # Thirty rather than twenty-five: the build now compiles :shared twice,
    # once for Android and once for the desktop target.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Repository text is intact
        run: python3 tools/check_text.py

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No wrapper jar is committed, so the Gradle version is pinned here.
      # 8.10.2 is the version this project's AGP 8.6.1 / Kotlin 2.2.20 pair is
      # tested against; letting the action pick "latest" silently changes the
      # toolchain under the build.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # The APK is built and uploaded before the tests run, on purpose. The tests
      # cover the scheduler and the governor, which are worth failing the run
      # over — but a failing test used to mean no artifact at all, so a run that
      # was meant to produce something installable produced a red cross instead.
      # Now the run still goes red, and the APK is still there.
      # The speech runtime is native code for four architectures, it lives in
      # app/libs, and it is not committed. Until now only the release workflow
      # needed it, and only for a second APK; with one APK nothing compiles
      # without it, so it is fetched first and a failure here fails the run.
      - name: Speech runtime
        run: bash tools/voice/fetch-voice.sh

      - name: Pinned starter deck
        run: bash tools/catalog/fetch-bundled-pack.sh

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      # Prints the signing certificate so a failed "install over the old app"
      # can be diagnosed from the log instead of the phone.
      - name: Signer
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $apk"
          keytool -printcert -jarfile "$apk" | grep -E 'Owner|SHA256' || true

      - name: APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ikna-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Room writes the schema of every version to app/schemas during the build,
      # and those files are what make a migration testable: without the old
      # schema there is nothing to migrate from, and an upgrade that drops user
      # data looks exactly like one that does not. They are meant to be
      # committed; uploading them here means a build always makes the current
      # one available, even if someone forgets.
      - name: Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ikna-room-schemas
          path: app/schemas
          if-no-files-found: warn

      # The artifact above is a convenience; this is the check. A build
      # regenerates the current schema, so no test can ever notice that the
      # folder was never committed - by the time tests run, the files are there.
      # Git can tell the difference. Anything untracked or changed under
      # app/schemas means this build produced a schema the repository does not
      # have, and the fix is always the same: commit it.
      - name: Schemas are committed
        run: |
          changes=$(git status --porcelain app/schemas)
          if [ -n "$changes" ]; then
            echo "app/schemas is untracked or has changed:"
            echo "$changes"
            echo "Download the ikna-room-schemas artifact, or run the build"
            echo "locally, and commit app/schemas. Migrations cannot be checked"
            echo "against a schema history that is not in the repository."
            exit 1
          fi

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testReleaseUnitTest

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ikna-test-report
          path: app/build/reports/tests/testReleaseUnitTest
          if-no-files-found: ignore

      # The APK above is a debug build, which does not run lint. A release
      # build does, and lint can fail it on things a debug build never sees
      # (manifest and resource rules, for one). Run that check here so a tag
      # is never pushed onto a commit the release workflow cannot build.
      - name: Release lint
        run: gradle --no-daemon --stacktrace lintVitalRelease

  # ---------------------------------------------------------------------------
  # The Windows application.
  #
  # Runs beside the Android job rather than after it: neither needs anything the
  # other produces, and a Windows runner is slow enough that chaining them would
  # roughly double the wait for a result.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest

    # Longer than the Android job: a Windows runner is slower, the Gradle cache
    # is cold, and jpackage has to assemble a Java runtime image.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle configures every project in settings.gradle.kts, and two of them
      # apply an Android plugin -- so even a build that only produces an .exe
      # needs an Android SDK present to configure :app and :shared. The Windows
      # images have carried one, but not by contract, and "the Windows build
      # broke because an image changed" is a bad morning. Make it explicit.
      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # The desktop module copies app/src/main/assets onto its classpath, and
      # the starter deck is downloaded into that folder rather than committed.
      # Without this the .exe builds and then opens with no decks in it.
      # shell: bash because this is a shell script and the default here is
      # PowerShell.
      - name: Pinned starter deck
        shell: bash
        run: bash tools/catalog/fetch-bundled-pack.sh

      # createReleaseDistributable produces the runnable application folder --
      # Ikna.exe plus a trimmed Java runtime. It needs no WiX, so this is the
      # step that must succeed.
      - name: Build the Windows application
        run: gradle --no-daemon --stacktrace :desktop:createReleaseDistributable

      # Uploaded as a folder: an artifact download is itself a zip, so zipping
      # here would only produce a zip inside a zip.
      - name: Windows application
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ikna-windows-portable
          path: desktop/build/compose/binaries/main-release/app
          if-no-files-found: warn

      # The packaged application, started once, on the runtime image that was
      # just assembled for it.
      #
      # This is the step that would have caught the palette crash on the build
      # machine instead of on a user's desktop. --selftest opens the database,
      # installs the bundled deck, writes a setting and builds a session, then
      # exits with a code; a missing module in the trimmed runtime -- which is
      # exactly what sun/misc/Unsafe was -- fails here and prints a stack trace
      # a person can read.
      #
      # It runs Ikna.exe itself. The runtime image jpackage assembles has its
      # launchers stripped out -- runtime/bin holds libraries and no java.exe --
      # so the application's own executable is the only way in. That executable
      # is a windowed program with no console attached, so the console stays
      # empty and the answer is read from the exit code and from the log the
      # test writes into a folder named here. The step sits after the upload, so
      # a failure still leaves an artifact to look at.
      - name: Self test
        shell: bash
        env:
          IKNA_SELFTEST_HOME: selftest-home
        run: |
          set -e
          root="desktop/build/compose/binaries/main-release/app"
          exe=$(find "$root" -name 'Ikna.exe' -o -name 'Ikna' -type f | head -n 1)
          if [ -z "$exe" ]; then
            echo "No application launcher under $root:"
            find "$root" -maxdepth 3
            exit 1
          fi
          echo "Launcher: $exe"
          code=0
          timeout 300 "$exe" --selftest || code=$?
          log="$IKNA_SELFTEST_HOME/logs/ikna-desktop.log"
          if [ -f "$log" ]; then
            echo "----- self test log -----"
            cat "$log"
            echo "-------------------------"
          else
            echo "The self test wrote no log at $log"
          fi
          exit $code

      # The installer is a convenience, not the deliverable. It needs WiX, which
      # the runner may or may not have, so a failure here must not take the
      # portable build down with it.
      - name: Installer
        continue-on-error: true
        run: gradle --no-daemon --stacktrace :desktop:packageReleaseMsi

      - name: Installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ikna-windows-msi
          path: desktop/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The Linux application.
  #
  # The same module and the same Gradle task as the Windows job.
  # createReleaseDistributable is not a Windows task: it asks jpackage for an
  # application image, and jpackage builds one for the machine it is running
  # on. Nothing is ported here and no screen is drawn twice -- the difference
  # between the two jobs is which runner they ask and what is done with the
  # folder that comes out.
  #
  # What comes out is a folder, and no jpackage format turns it into one file:
  # app-image is that folder, deb and rpm are installers tied to the
  # distribution that builds them, so a .deb built here would be a promise
  # about Fedora that nobody checked. The folder is therefore packed into an
  # .AppImage -- one executable file that runs on any x86_64 desktop with
  # nothing installed and nothing to uninstall.
  #
  # Beside the other two jobs rather than after them: none of the three needs
  # anything another one produces.
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest

    # Longer than the Android job on the same image: jpackage has to assemble a
    # Java runtime image and appimagetool has to squash it.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No setup-android step, unlike the Windows job. Gradle still has to
      # configure :app and :shared to build :desktop, so an SDK still has to be
      # present -- but this is the image the android job above builds an APK
      # on, which is a stronger guarantee than any action could add.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # :desktop copies app/src/main/assets onto its classpath and the starter
      # deck is downloaded into that folder rather than committed. Without this
      # the application builds and then opens with no decks in it.
      - name: Pinned starter deck
        run: bash tools/catalog/fetch-bundled-pack.sh

      - name: Build the Linux application
        run: gradle --no-daemon --stacktrace :desktop:createReleaseDistributable

      - name: AppImage
        run: bash tools/appimage/build-appimage.sh build/appimage/ikna-x86_64.AppImage

      # Uploaded before the self test runs, for the same reason the Windows
      # folder is: a run that goes red should still leave something to install.
      - name: AppImage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ikna-linux-appimage
          path: build/appimage/*.AppImage
          if-no-files-found: warn

      # The packaged application, started once, on the runtime image that was
      # just assembled for it -- and through the AppImage rather than beside
      # it, so what is tested is the file that gets published.
      #
      # --selftest opens the database, installs the bundled deck, writes a
      # setting and builds a session, then exits with a code. A module missing
      # from the trimmed runtime -- which is exactly what sun/misc/Unsafe was
      # on Windows -- fails here, on the machine that produced the file, and
      # prints a stack trace a person can read.
      #
      # APPIMAGE_EXTRACT_AND_RUN because mounting an AppImage needs
      # libfuse.so.2 and the runner does not have it; the runtime unpacks
      # itself into a temporary folder instead. xvfb-run when the image has it:
      # the self test opens no window, but a JVM given an empty display is a
      # smaller surprise than a JVM given none.
      - name: Self test
        run: |
          set -e
          export IKNA_SELFTEST_HOME="$GITHUB_WORKSPACE/selftest-home"
          export APPIMAGE_EXTRACT_AND_RUN=1
          image="build/appimage/ikna-x86_64.AppImage"
          if [ ! -f "$image" ]; then
            echo "No AppImage at $image"
            exit 1
          fi
          code=0
          if command -v xvfb-run >/dev/null 2>&1; then
            timeout 300 xvfb-run -a "./$image" --selftest || code=$?
          else
            timeout 300 "./$image" --selftest || code=$?
          fi
          log="$IKNA_SELFTEST_HOME/logs/ikna-desktop.log"
          if [ -f "$log" ]; then
            echo "----- self test log -----"
            cat "$log"
            echo "-------------------------"
          else
            echo "The self test wrote no log at $log"
          fi
          exit $code

      # Only when something went wrong. It is a hundred megabytes of runtime
      # image, and the only reason to download it is to find out why the file
      # above is missing or does not start.
      - name: Application image, if this job failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ikna-linux-app-image
          path: desktop/build/compose/binaries/main-release/app
          if-no-files-found: ignore
