name: release

# Publishing a version is one action: push a tag that starts with v.
#
#   git tag v0.3.0
#   git push origin v0.3.0
#
# Everything below happens without anyone opening a browser: tests run, a signed
# APK is built, it is renamed after the tag, and it is attached to the GitHub
# release together with generated notes. Nothing is uploaded by hand, so the file
# on the release page is always the one built from that exact commit.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed to create the release and attach the file to it.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    # Same reason as in build.yml: fail loudly rather than hang for six hours.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Repository text is intact
        run: python3 tools/check_text.py

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # A red release is worse than a late one: the APK is attached to a page
      # people download from, so the tests run before it is built, not after.
      # Fetched before anything is compiled: the speech runtime is a local .aar
      # that is not committed, and since the two builds became one even the unit
      # tests need it on the classpath.
      - name: Speech runtime
        run: bash tools/voice/fetch-voice.sh

      - name: Pinned starter deck
        run: bash tools/catalog/fetch-bundled-pack.sh

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testReleaseUnitTest

      # The version lives in app/build.gradle.kts, not in the tag, because
      # F-Droid builds this repository on a machine that knows nothing about
      # either tags or CI. The tag is only a label - so it has to agree with the
      # file, and a disagreement is caught here rather than discovered later on
      # a release page offering an APK with the wrong number inside it.
      # A version name is "0.1.0 proof" - a number and the epoch it belongs
      # to - and a git tag cannot contain a space, so the tag is the same string
      # with the space turned into a dash: v0.1.0-proof. That is the only
      # difference allowed between the two; the number and the epoch word still
      # have to agree character for character.
      - name: Tag matches the version in the build file
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declared=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          slug=$(echo "$declared" | tr ' ' '-')
          echo "build file says '$declared' (tag form v$slug), tag says $GITHUB_REF_NAME"
          if [ "v$slug" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match appVersionName '$declared' - bump app/build.gradle.kts or move the tag"
            exit 1
          fi

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Name the file after the tag
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/ikna-${GITHUB_REF_NAME}.apk"

      # Phones older than about 2017 are 32-bit and cannot install the file
      # above. Same code, one architecture down, published beside it under a
      # name that says who needs it. Built second and copied straight after,
      # because both builds write to the same folder under the same name.
      - name: Build release APK for 32-bit phones
        run: gradle --no-daemon --stacktrace assembleRelease -Pikna.abi=legacy32

      - name: Name the 32-bit file after the tag
        run: |
          cp app/build/outputs/apk/release/*.apk "out/ikna-${GITHUB_REF_NAME}-legacy32.apk"

      - name: Signer
        run: |
          for apk in out/*.apk; do
            echo "== $apk"
            keytool -printcert -jarfile "$apk" | grep -E 'Owner|SHA256' || true
          done

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
