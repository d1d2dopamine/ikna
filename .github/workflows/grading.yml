name: grading-validation

on:
  workflow_call:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"
      - name: CJK catalogue segmentation regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libicu-dev
          python3 tools/catalog/test_segmentation.py
          python3 tools/catalog/test_catalogue_v2_contract.py
      - name: Verify text, fixtures and additive migrations
        run: |
          python3 tools/check_text.py
          python3 tools/check_localization.py
          python3 tools/grading/generate_synthetic.py --check
          python3 tools/check_grading.py
          python3 tools/grading/check_full.py
          python3 tools/check_optimizer.py
          python3 tools/check_design_parity.py
          python3 tools/check_palettes.py
          python3 tools/check_nsis.py
          python3 tools/make_palette_preview.py --check
          python3 tools/check_android_ci.py --self-test
          python3 tools/check_android_ci.py
      - name: Settings source contracts (Java 8 API compatibility and JUnit assertions)
        shell: bash
        run: |
          classes="$(mktemp -d)"
          trap 'rm -rf "$classes"' EXIT
          javac --release 8 -encoding UTF-8 -d "$classes" \
            app/src/test/java/dev/ikna/ui/SettingsSourceContracts.java
          java -cp "$classes" dev.ikna.ui.SettingsSourceContracts
          javac --release 8 -encoding UTF-8 -d "$classes" \
            desktop/src/main/java/dev/ikna/desktop/TitleBarClicks.java \
            desktop/src/test/java/dev/ikna/desktop/TitleBarClicksChecks.java
          java -cp "$classes" dev.ikna.desktop.TitleBarClicksChecks
      - name: Speech runtime cache
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-*.aar
          key: sherpa-onnx-aar-${{ runner.os }}-${{ hashFiles('tools/voice/fetch-voice.sh') }}

      - name: Existing build assets
        run: |
          bash tools/voice/fetch-voice.sh
          bash tools/catalog/fetch-bundled-pack.sh
      - name: Compile both targets and run JVM regression suites
        run: bash tools/ci/run-gradle.sh ci-logs/jvm-build.log --continue :desktop:test :app:testReleaseUnitTest :app:assembleDebug
      - name: Paired replay of synthetic scenarios using production Kotlin
        shell: bash
        run: |
          for scenario in verified immature noise; do
            gradle --no-daemon :desktop:gradingLab \
              -Pgrading.input="tools/grading/fixtures/synthetic-$scenario.jsonl" \
              -Pgrading.output="build/grading/$scenario.txt"
          done
          python3 tools/grading/check_reports.py build/grading
      - name: Room output agrees with committed schema
        run: |
          changes=$(git status --porcelain app/schemas)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Commit the compiler-generated Room schema before release."
            exit 1
          fi
      - name: Test reports and compiler schemas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: grading-jvm-reports
          path: |
            build/grading/
            desktop/build/reports/tests/test/
            app/build/reports/tests/testReleaseUnitTest/
            app/schemas/
            ci-logs/
          if-no-files-found: warn

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare migration diagnostics and check DEX-safe names
        shell: bash
        run: |
          mkdir -p ci-logs
          printf '%s\n' 'Migration validation: minSdk 29; emulator API 35; x86_64; Gradle 8.10.2.' > ci-logs/migrations-context.txt
          python3 tools/check_android_ci.py --self-test
          python3 tools/check_android_ci.py
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"
          # The parallel JVM job writes the cache; this job only restores it.
          cache-read-only: true
      - name: Speech runtime cache
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-*.aar
          key: sherpa-onnx-aar-${{ runner.os }}-${{ hashFiles('tools/voice/fetch-voice.sh') }}

      - name: Existing build assets
        run: |
          bash tools/voice/fetch-voice.sh
          bash tools/catalog/fetch-bundled-pack.sh
      - name: Build application and instrumented APK before starting emulator
        run: bash tools/ci/run-gradle.sh ci-logs/android-test-apk.log :app:assembleDebug :app:assembleDebugAndroidTest -Pikna.abi=emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android SQLite migration validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/ci/run-gradle.sh ci-logs/android-connected-tests.log :app:connectedDebugAndroidTest -Pikna.abi=emulator
      - name: Instrumented migration report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: grading-migration-reports
          path: |
            ci-logs/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/logs/
          if-no-files-found: warn
