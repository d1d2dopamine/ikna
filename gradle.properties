org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# :shared wires commonMain -> jvmShared -> androidMain/desktopMain by hand,
# because the default hierarchy template has no node for "Android and the
# desktop but not iOS". Gradle then warns on every build that the template was
# not applied. The hand-written edges are the intended layout, so the template
# is switched off rather than the edges removed. This changes nothing about
# what is compiled: a target's own source set depends on commonMain through
# core multiplatform behaviour, not through the template.
kotlin.mpp.applyDefaultHierarchyTemplate=false
